<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Otomori — estudos de símbolo 3</title>
<style>
  body { margin: 0; padding: 32px 40px; background: #f4f3ef; font: 15px/1.4 "Segoe UI", system-ui, sans-serif; color: #222; width: 1120px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #666; }
  .linha { display: grid; grid-template-columns: 28px 200px 1fr 64px 48px 64px 48px; align-items: center; gap: 24px; padding: 14px 0; border-top: 1px solid #ddd; }
  .letra { font-size: 22px; font-weight: 700; }
  .grande svg { width: 190px; height: 190px; display: block; }
  .nome { font-weight: 600; font-size: 17px; }
  .desc { color: #555; font-size: 14px; margin-top: 4px; }
  .p32 svg { width: 32px; height: 32px; display: block; }
  .p16 svg { width: 16px; height: 16px; display: block; }
  .escuro { background: #16181d; border-radius: 8px; padding: 10px; display: grid; place-items: center; }
  .rot { font-size: 11px; color: #888; text-align: center; margin-top: 4px; }
  svg { color: #111; } .escuro svg { color: #f2f2f2; }
</style></head><body>
<h1>Otomori — símbolo, estudos 3</h1>
<p class="sub">O 森 da A em todas. Muda só o O: cinco jeitos de ele ser "som" sem virar um sol espetado.</p>
<div id="lista"></div>
<script>
  const C = 256, TAU = Math.PI * 2
  const kanji = `<text x="${C}" y="${C + 4}" text-anchor="middle" dominant-baseline="central" font-family="Yu Gothic UI, Yu Gothic, Meiryo, sans-serif" font-weight="700" font-size="226" fill="currentColor">森</text>`
  const svg = (corpo) => `<svg viewBox="0 0 512 512">${kanji}${corpo}</svg>`
  const ponto = (r, a) => [C + Math.cos(a) * r, C + Math.sin(a) * r]
  const f = (n) => n.toFixed(1)

  // 1. Anel que pulsa: a espessura varia numa onda suave.
  function pulso() {
    const n = 360, pts = [], dentro = 186
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * TAU - Math.PI / 2
      const v = 0.5 + 0.3 * Math.sin(3 * a + 0.4) + 0.2 * Math.sin(5 * a + 1.9)
      pts.push(ponto(dentro + 14 + 40 * Math.max(0, v), a))
    }
    const fora = 'M' + pts.map(([x, y]) => `${f(x)} ${f(y)}`).join(' L') + ' Z'
    return `<path fill="currentColor" fill-rule="evenodd" d="${fora} M${C + dentro} ${C} A${dentro} ${dentro} 0 1 0 ${C - dentro} ${C} A${dentro} ${dentro} 0 1 0 ${C + dentro} ${C} Z"/>`
  }
  // 2. Aro fino com barras so na metade de baixo, como um medidor.
  function medidor() {
    let s = `<circle cx="${C}" cy="${C}" r="196" fill="none" stroke="currentColor" stroke-width="18"/>`
    const alts = [0.25, 0.45, 0.7, 0.5, 0.9, 1, 0.65, 0.8, 0.4, 0.55, 0.3]
    alts.forEach((h, i) => {
      const a = Math.PI * (0.12 + 0.76 * (i / (alts.length - 1)))
      const [x1, y1] = ponto(214, a), [x2, y2] = ponto(214 + 38 * h, a)
      s += `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>`
    })
    return s
  }
  // 3. Pulso de batida: barras iguais e baixas, com tres picos.
  function batida() {
    let s = ''
    const n = 44
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU - Math.PI / 2
      const pico = [5, 6, 7, 20, 21, 33, 34, 35].includes(i)
      const alto = [6, 21, 34].includes(i)
      const comp = alto ? 54 : pico ? 34 : 14
      const [x1, y1] = ponto(190, a), [x2, y2] = ponto(190 + comp, a)
      s += `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/>`
    }
    return `<g stroke="currentColor" stroke-width="11" stroke-linecap="round">${s}</g>`
  }
  // 4. O de arcos: um anel quebrado em trechos de tamanhos diferentes.
  function arcos() {
    const trechos = [38, 14, 62, 22, 48, 10, 70, 26, 40, 30]
    const total = trechos.reduce((a, b) => a + b, 0), vao = 0.07, r = 206
    let a = -Math.PI / 2, s = ''
    for (const t of trechos) {
      const da = (t / total) * (TAU - vao * trechos.length)
      const [x1, y1] = ponto(r, a), [x2, y2] = ponto(r, a + da)
      s += `<path d="M${f(x1)} ${f(y1)} A${r} ${r} 0 ${da > Math.PI ? 1 : 0} 1 ${f(x2)} ${f(y2)}"/>`
      a += da + vao
    }
    return `<g fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round">${s}</g>`
  }
  // 5. Duas linhas: um aro e, colado nele, um segundo aro que oscila.
  function eco() {
    const n = 360, pts = []
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * TAU
      pts.push(ponto(222 + 12 * Math.sin(6 * a) * (0.6 + 0.4 * Math.sin(2 * a + 1)), a))
    }
    return `<circle cx="${C}" cy="${C}" r="188" fill="none" stroke="currentColor" stroke-width="20"/>` +
      `<path fill="none" stroke="currentColor" stroke-width="12" d="M${pts.map(([x, y]) => `${f(x)} ${f(y)}`).join(' L')} Z"/>`
  }

  const itens = [
    ['1', 'Anel que pulsa', 'O O tem espessura que sobe e desce numa onda suave, como um alto-falante vibrando. Sem barras.', svg(pulso())],
    ['2', 'Aro + medidor embaixo', 'O fechado e fino; só a metade de baixo tem barras, como o medidor de volume.', svg(medidor())],
    ['3', 'Batida', 'Barras curtas e iguais, com três picos. Parece um batimento, não um sol.', svg(batida())],
    ['4', 'O de trechos', 'O anel quebrado em pedaços de tamanhos diferentes: o ritmo está nos intervalos.', svg(arcos())],
    ['5', 'Aro + eco', 'Um aro firme e, por fora, uma linha fina que ondula: o som saindo da floresta.', svg(eco())],
  ]
  const lista = document.getElementById('lista')
  for (const [id, nome, desc, s] of itens) {
    const l = document.createElement('div'); l.className = 'linha'
    l.innerHTML = `<div class="letra">${id}</div><div class="grande">${s}</div>
      <div><div class="nome">${nome}</div><div class="desc">${desc}</div></div>
      <div class="p32">${s}<div class="rot">32</div></div><div class="p16">${s}<div class="rot">16</div></div>
      <div class="escuro p32">${s}</div><div class="escuro p16">${s}</div>`
    lista.append(l)
  }
</script>
</body></html>
