<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Otomori — estudos de símbolo 4</title>
<style>
  body { margin: 0; padding: 32px 40px; background: #f4f3ef; font: 15px/1.4 "Segoe UI", system-ui, sans-serif; color: #222; width: 1120px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #666; }
  .linha { display: grid; grid-template-columns: 28px 200px 1fr 64px 48px 64px 48px; align-items: center; gap: 24px; padding: 12px 0; border-top: 1px solid #ddd; }
  .letra { font-size: 22px; font-weight: 700; }
  .grande svg { width: 176px; height: 176px; display: block; }
  .nome { font-weight: 600; font-size: 17px; }
  .desc { color: #555; font-size: 14px; margin-top: 4px; }
  .p32 svg { width: 32px; height: 32px; display: block; }
  .p16 svg { width: 16px; height: 16px; display: block; }
  .escuro { background: #16181d; border-radius: 8px; padding: 10px; display: grid; place-items: center; }
  .rot { font-size: 11px; color: #888; text-align: center; margin-top: 4px; }
  svg { color: #111; } .escuro svg { color: #f2f2f2; }
</style></head><body>
<h1>Otomori — símbolo, estudos 4: o anel que pulsa</h1>
<p class="sub">Variações do 1. O que muda: quantas "ondas" o anel tem, quanto ele se mexe e para que lado.</p>
<div id="lista"></div>
<script>
  const C = 256, TAU = Math.PI * 2
  const kanji = (tam = 226) => `<text x="${C}" y="${C + 4}" text-anchor="middle" dominant-baseline="central" font-family="Yu Gothic UI, Yu Gothic, Meiryo, sans-serif" font-weight="700" font-size="${tam}" fill="currentColor">森</text>`
  const f = (n) => n.toFixed(1)
  const ponto = (r, a) => [C + Math.cos(a) * r, C + Math.sin(a) * r]
  const circulo = (r) => `M${C + r} ${C} A${r} ${r} 0 1 0 ${C - r} ${C} A${r} ${r} 0 1 0 ${C + r} ${C} Z`
  const curva = (raio) => {
    const n = 480, pts = []
    for (let i = 0; i <= n; i++) { const a = (i / n) * TAU - Math.PI / 2; pts.push(ponto(raio(a), a)) }
    return 'M' + pts.map(([x, y]) => `${f(x)} ${f(y)}`).join(' L') + ' Z'
  }
  // Anel: borda de dentro e de fora, cada uma com seu raio por angulo.
  const anel = (dentro, fora) => `<path fill="currentColor" fill-rule="evenodd" d="${curva(fora)} ${typeof dentro === 'number' ? circulo(dentro) : curva(dentro)}"/>`
  const svg = (corpo, tam) => `<svg viewBox="0 0 512 512">${kanji(tam)}${corpo}</svg>`

  const itens = [
    ['A', 'O original', 'O 1 da folha anterior, para comparar: três ondas mais duas, só para fora.',
      svg(anel(186, (a) => 200 + 40 * Math.max(0, 0.5 + 0.3 * Math.sin(3 * a + 0.4) + 0.2 * Math.sin(5 * a + 1.9))))],
    ['B', 'Mais calmo', 'A mesma onda com metade do movimento: o O quase redondo, só respirando.',
      svg(anel(188, (a) => 210 + 20 * (0.5 + 0.3 * Math.sin(3 * a + 0.4) + 0.2 * Math.sin(5 * a + 1.9))))],
    ['C', 'Três ondas iguais', 'Uma onda só, de três batidas: mais geométrico e simétrico, como um logotipo desenhado.',
      svg(anel(188, (a) => 214 + 20 * Math.sin(3 * a - Math.PI / 2)))],
    ['D', 'Dentro e fora', 'O anel vibra para os dois lados, como a membrana de um alto-falante.',
      svg(anel((a) => 190 + 10 * Math.sin(4 * a + 1), (a) => 218 + 16 * Math.sin(4 * a + 1) + 8 * Math.sin(7 * a)), 214)],
    ['E', 'Grosso e pesado', 'Anel mais largo, o 森 um pouco menor: mais peso, lê melhor pequeno.',
      svg(anel(176, (a) => 214 + 26 * (0.5 + 0.3 * Math.sin(3 * a + 0.4) + 0.2 * Math.sin(5 * a + 1.9))), 200)],
    ['F', 'Pulso de um lado', 'Redondo quase todo, e um único trecho que se mexe, como um som escapando por um lado.',
      svg(anel(188, (a) => { const d = Math.atan2(Math.sin(a - 0.5), Math.cos(a - 0.5)); return 212 + 30 * Math.exp(-(d * d) / 0.35) * (0.6 + 0.4 * Math.sin(9 * a)) }))],
  ]
  const lista = document.getElementById('lista')
  for (const [id, nome, desc, s] of itens) {
    const l = document.createElement('div'); l.className = 'linha'
    l.innerHTML = `<div class="letra">${id}</div><div class="grande">${s}</div>
      <div><div class="nome">${nome}</div><div class="desc">${desc}</div></div>
      <div class="p32">${s}<div class="rot">32</div></div><div class="p16">${s}<div class="rot">16</div></div>
      <div class="escuro p32">${s}</div><div class="escuro p16">${s}</div>`
    lista.append(l)
  }
</script>
</body></html>
