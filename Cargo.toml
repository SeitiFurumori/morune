[workspace]
resolver = "2"
members = [
    "crates/morune-core",
    "crates/morune-theme",
    "crates/morune-storage",
    "crates/morune-app",
    "crates/morune-spotify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/SeitiFurumori/morune"
authors = ["Felipe Seiti Furumori"]

[workspace.dependencies]
morune-core = { path = "crates/morune-core" }
morune-theme = { path = "crates/morune-theme" }
morune-storage = { path = "crates/morune-storage" }
morune-spotify = { path = "crates/morune-spotify" }

thiserror = "2"
anyhow = "1"
# "rc" habilita Serialize/Deserialize para Arc<str>, usado nos ids e nomes do
# modelo: compartilhar a string entre fila, cache e UI evita copiar o mesmo
# titulo dezenas de vezes numa lista longa.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
directories = "6"

# Perfil de desenvolvimento: compilacao rapida, sem sacrificar o runtime das deps.
[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 2

# Perfil das verificacoes de CI. O perfil `dev` compila as dependencias com
# `opt-level = 2` de proposito -- e o que mantem o aplicativo utilizavel
# enquanto se desenvolve. Num runner, porem, esse mesmo ajuste fazia o build de
# teste custar mais que o de release, para rodar 136 testes em 0,4 segundo.
# Aqui nada precisa ser rapido em tempo de execucao, so de compilacao.
[profile.ci]
inherits = "dev"
debug = 0

# `inherits` copia tambem os ajustes por pacote do perfil de origem, entao
# desligar a otimizacao das dependencias exige dize-lo outra vez.
[profile.ci.package."*"]
opt-level = 0

# Perfil de release: otimizado para tamanho + velocidade, alvo do performance budget.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# A librespot encerrava o processo em conta nao-Premium: `check_catalogue`
# chamava `process::exit(1)` no manipulador do pacote de produto, e a janela
# sumia sem erro, sem log e sem aviso. Num aplicativo aberto isso e o primeiro
# contato da maioria das contas do Spotify com o Morune -- ver vendor/README.md.
#
# A copia em `vendor/` muda esse metodo e nada mais. `patch.crates-io` faz
# `librespot-playback`, `-metadata` e `-oauth` usarem a mesma copia, sem que
# nenhum deles precise ser alterado.
[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
