[package]
name = "morune-app"
description = "Interface e ponto de entrada do Morune."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "morune"
path = "src/main.rs"

[features]
default = ["hot-reload", "bundled-fonts"]
hot-reload = ["morune-theme/hot-reload"]
# Captura a propria janela em PNG a partir do renderizador do Slint. Usada pela
# verificacao visual de temas; fora do build de release para nao carregar um
# codificador de imagem no binario que o usuario instala.
snapshot = ["dep:png"]
# Fontes que vem dentro de um `.musicpack` (`bundled_font`).
#
# Sem ela, um tema so pode citar fonte ja instalada na maquina de quem baixou --
# o que faz um tema compartilhado chegar errado na casa dos outros, justamente
# onde o produto mais precisa acertar.
#
# **Aviso ao atualizar o Slint:** no 1.17 nao existe API estavel para registrar
# fonte em tempo de execucao. A unica via e `slint::fontique_010`, que o proprio
# Slint marca como instavel, e o nome do modulo carrega a versao do fontique.
# Uma atualizacao do Slint pode quebrar a compilacao de `registrar_fonte` em
# `theme_bridge.rs`. A quebra e visivel no build, nunca silenciosa em execucao;
# se atrapalhar, desligar esta feature devolve o comportamento antigo.
bundled-fonts = ["slint/unstable-fontique-010"]

[dependencies]
morune-core = { workspace = true }
morune-theme = { workspace = true }
morune-storage = { workspace = true }
morune-spotify = { workspace = true }
# Apenas pelo tipo do canal de eventos do motor; o runtime e do morune-spotify.
tokio = { workspace = true }

# Renderizador: femtovg usa OpenGL e nao arrasta Skia (que sozinho passaria do
# orcamento de tamanho do instalador). O renderizador por software fica como
# reserva automatica em maquinas sem GPU utilizavel.
slint = { version = "1.17", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "raw-window-handle-06",
    "std",
] }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# Dialogos nativos de arquivo para importar/exportar .musicpack. No Windows usa
# as caixas COM do sistema, sem trazer nenhum toolkit adicional.
rfd = "0.15"
png = { version = "0.18", optional = true }

# Verificacao e download de atualizacao (`update.rs`). O `reqwest` ja esta no
# binario pela librespot; entrar aqui como dependencia direta com
# `default-features = false` mantem a **mesma** instancia do crate e o mesmo TLS
# do sistema (schannel, via native-tls) -- ligar `rustls` acrescentaria uma
# segunda pilha de TLS ao instalador por nada.
#
# A feature `blocking` existe porque este caminho vive numa thread propria, e
# nao no runtime do backend: verificar atualizacao nao pode depender de haver
# sessao do Spotify aberta.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "default-tls",
] }
# Confere o `.sha256` publicado ao lado do instalador. Ja esta no binario pela
# librespot, entao nao acrescenta tamanho.
sha2 = "0.10"
# Icone de bandeja: fechar a janela nao pode encerrar a reproducao, e a bandeja
# e o unico jeito visivel de voltar ou de sair de verdade.
tray-icon = "0.21"

[target.'cfg(windows)'.dependencies]
# Integra os controles anterior/tocar-proxima ao preview nativo da barra de
# tarefas, sem carregar outro toolkit de interface no executavel.
raw-window-handle = "0.6"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Area util do monitor onde o icone da bandeja esta, para o menu proprio
    # nascer onde cabe. Ver `work_area` em `tray_menu.rs`.
    "Win32_Graphics_Gdi",
    # `SetFocus`, no caminho que da foco ao menu da bandeja. Sem foco a janela
    # nunca e desativada, e um menu que nunca desativa nunca fecha ao clicar
    # fora. Ver `bring_to_front` em `tray_menu.rs`.
    "Win32_UI_Input_KeyboardAndMouse",
    # Cantos arredondados da janela. Ver `round_window_corners` em `main.rs`.
    "Win32_Graphics_Dwm",
] }

[build-dependencies]
slint-build = "1.17"
# Decodifica os PNGs da marca em tempo de build, para que o executavel carregue
# pixels crus e nao um decodificador. Ver `embed_brand_pixels` em build.rs.
png = "0.18"
