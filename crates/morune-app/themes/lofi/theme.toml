# Lo-fi -- o quarto de quem estuda de madrugada com musica baixa.
# Imagem gerada pelo Felipe. A luz e a da luminaria: destaque ambar sobre a
# noite azul. A chuva cai so no vidro da janela, atras dos paineis, e para
# sozinha com jogo em tela cheia ou movimento reduzido.
#
# ICONES: os embutidos sao do Phosphor. Para trocar, ponha um .svg com o nome
# do icone em assets/icons/ -- ver docs/THEMING.md, secao "Icones".

[color]
background         = "#12141c"
surface            = "#161827c4"
sidebar_background = "#131523c8"
player_background  = "#161827cc"
surface_raised     = "#20233af2"
text           = "#f4ede4"
text_muted     = "#bdb3a8"
text_on_accent = "#1a1410"
accent         = "#ffb870"
accent_hover   = "#ffc994"
border           = "#7a7384"
border_highlight = "#ffd98e40"
hover            = "#ffd98e14"
selected         = "#ffb87026"
focus_ring       = "#ffb870"
success          = "#8fd6a0"
warning          = "#ffd98e"
danger           = "#ff8a80"
shadow           = "#00000040"
scrollbar        = "#958ca2cc"

[typography]
family         = "M PLUS 1"
display_family = "Zen Kaku Gothic New"
bundled_fonts  = [
    "MPLUS1-Regular.ttf",
    "MPLUS1-Bold.ttf",
    "ZenKakuGothicNew-Regular.ttf",
    "ZenKakuGothicNew-Bold.ttf",
]
scale  = 1.0
size_xs      = 12.0
size_sm      = 13.0
size_md      = 15.0
size_lg      = 18.0
size_xl      = 24.0
size_display = 34.0
weight_normal = 400
weight_medium = 600
weight_bold   = 700
line_height    = 1.5
letter_spacing = 0.0

[shape]
radius_sm      = 8.0
radius_md      = 12.0
radius_lg      = 16.0
radius_artwork = 10.0
radius_avatar  = 999.0
spacing_xs = 4.0
spacing_sm = 8.0
spacing_md = 14.0
spacing_lg = 24.0
spacing_xl = 36.0
border_width       = 1.0
progress_thickness = 3.0
scrollbar_width    = 10.0

[control]
button_size         = 34.0
button_radius       = 999.0
primary_button_size = 44.0
icon_size           = 18.0
icon_size_primary   = 22.0
icon_stroke         = 1.4
slider_knob         = 12.0
tooltip_height      = 30.0

[motion]
# Devagar: musica baixa, sem pressa.
enabled         = true
speed           = 1.0
duration_fast   = 140
duration_normal = 240
duration_slow   = 380
easing          = "ease-in-out"

[effects]
material              = "liquid"
window_opacity        = 1.0
acrylic               = false
shadow_strength       = 0.0
gloss                 = 0.0
backdrop_blur         = 0.0
artwork_tint          = false
artwork_tint_strength = 0.0
artwork_accent        = false

[background]
image = "assets/fundo/quarto.jpg"
fit = "cover"
opacity = 1.0
tint = "#12141c"
tint_strength = 0.0
blur = 0.0

[scene]
kind = "chuva"

# So no vidro da janela, em fracao da imagem. O recorte evita a cabeca da
# menina (a esquerda) e o notebook (embaixo).
[scene.rain]
x        = 0.39
y        = 0.0
width    = 0.38
height   = 0.53
strength = 0.25
wind     = 0.0
