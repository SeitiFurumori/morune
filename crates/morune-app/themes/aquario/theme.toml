# Aquario — Frutiger Aero/Aqua: natureza, agua, luz e controles em gel claro.
# Azul e verde pertencem a cena; branco e ciano organizam os controles.
# Direcao: docs/design/PESQUISA-AQUARIO-BRUMA-2026-09-10.md.
# A cena e do proprio tema. O desktop nao deve atravessar texto nem capas.

[color]
background         = "#dceffa"
surface            = "#d6e9fa30"
surface_raised     = "#eef8ff"
sidebar_background = "#d6e9fa38"
player_background  = "#d6e9fa38"
# Tinta petrol; o texto secundario precisa sobreviver a agua e a grama.
text           = "#08232e"
text_muted     = "#0c2530"
text_on_accent = "#f2f9ff"
accent         = "#0f4a75"
accent_hover   = "#1a6ca1"
border           = "#0a2a4aa6"
border_highlight = "#ffffffb8"
hover            = "#bee6fdb8"
selected         = "#98d1efd6"
focus_ring       = "#0c3b48"
success          = "#267b48"
warning          = "#876209"
danger           = "#c1342f"
shadow           = "#0a3a4a26"
scrollbar        = "#0a3a4a9e"

[typography]
family         = "Segoe UI"
display_family = "Segoe UI"
scale = 1.0
size_xs      = 12.0
size_sm      = 13.0
size_md      = 15.0
size_lg      = 19.0
size_xl      = 25.0
size_display = 36.0
weight_normal = 400
weight_medium = 600
weight_bold   = 700
line_height    = 1.45
letter_spacing = 0.0

[shape]
radius_sm      = 4.0
radius_md      = 6.0
radius_lg      = 8.0
radius_artwork = 12.0
radius_avatar  = 999.0
spacing_xs = 4.0
spacing_sm = 9.0
spacing_md = 15.0
spacing_lg = 24.0
spacing_xl = 36.0
border_width = 1.0
progress_thickness = 9.0
scrollbar_width    = 12.0

[control]
button_size         = 36.0
button_radius       = 999.0
primary_button_size = 50.0
icon_size           = 18.0
icon_size_primary   = 24.0
icon_stroke         = 1.9
slider_knob         = 18.0
tooltip_height      = 30.0

[motion]
enabled = true
speed           = 0.9
duration_fast   = 140
duration_normal = 240
duration_slow   = 400
easing          = "ease-in-out"

[effects]
material = "aero"
# Alfa global menor que 1 tambem apaga texto, icones e capas no Windows.
window_opacity = 1.0
acrylic        = false
shadow_strength = 0.35
backdrop_blur   = 0.0
gloss           = 0.8
artwork_tint          = false
artwork_tint_strength = 0.0

[background]
# Imagem escolhida e fornecida pelo usuario em 2026-09-13.
# A copia borrada fornece o vidro das barras, sem depender do desktop.
image = "assets/cidade-aero.jpg"
fit   = "cover"
opacity = 0.96
tint          = "#ffffff"
tint_strength = 0.0
blur          = 0.0
