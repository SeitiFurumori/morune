# Travessia -- o limiar, a hora azul, mono no aware.
# O conceito e o do portfolio "Travessia" do Felipe: atravessar a madrugada ate
# o amanhecer. Nada de neon: violeta sobre a noite, serifa japonesa nos titulos.
#
# A cena e animada e para sozinha com jogo em tela cheia, com movimento
# reduzido ou com a janela escondida. O ceu anda com o relogio do Windows.
#
# ICONES: os embutidos sao do Phosphor. Para trocar, ponha um .svg com o nome
# do icone em assets/icons/ -- ver docs/THEMING.md, secao "Icones".

[color]
background         = "#07060e"
surface            = "#140f2280"
sidebar_background = "#0b09188c"
player_background  = "#0b09188c"
surface_raised     = "#1e1630f2"
text           = "#ede9f7"
text_muted     = "#9f98b8"
text_on_accent = "#07060e"
accent         = "#c4a6ff"
accent_hover   = "#d8c4ff"
border           = "#7564a0"
border_highlight = "#8b5ae055"
hover            = "#8b5ae01a"
selected         = "#8b5ae033"
focus_ring       = "#c4a6ff"
success          = "#6fe7b0"
warning          = "#ffd98e"
danger           = "#ff7b93"
shadow           = "#00000040"
scrollbar        = "#7d74a0cc"

[typography]
family         = "Zen Kaku Gothic New"
display_family = "Zen Old Mincho"
bundled_fonts  = [
    "ZenKakuGothicNew-Regular.ttf",
    "ZenKakuGothicNew-Bold.ttf",
    "ZenOldMincho-Regular.ttf",
    "ZenOldMincho-Bold.ttf",
]
scale  = 1.0
size_xs      = 12.0
size_sm      = 13.0
size_md      = 15.0
size_lg      = 18.0
size_xl      = 26.0
size_display = 36.0
weight_normal = 400
weight_medium = 500
weight_bold   = 700
line_height    = 1.5
letter_spacing = 0.0

[shape]
radius_sm      = 8.0
radius_md      = 14.0
radius_lg      = 20.0
radius_artwork = 10.0
radius_avatar  = 999.0
spacing_xs = 4.0
spacing_sm = 8.0
spacing_md = 14.0
spacing_lg = 24.0
spacing_xl = 36.0
border_width       = 1.0
progress_thickness = 3.0
scrollbar_width    = 10.0

[control]
button_size         = 34.0
button_radius       = 999.0
primary_button_size = 44.0
icon_size           = 18.0
icon_size_primary   = 22.0
icon_stroke         = 1.4
slider_knob         = 12.0
tooltip_height      = 30.0

[motion]
# Mais lento que o Bruma: a noite nao tem pressa.
enabled         = true
speed           = 1.0
duration_fast   = 140
duration_normal = 240
duration_slow   = 380
easing          = "ease-in-out"

[effects]
material              = "liquid"
finish                = "starry"
window_opacity        = 1.0
acrylic               = false
shadow_strength       = 0.2
gloss                 = 0.0
backdrop_blur         = 0.0
artwork_tint          = false
artwork_tint_strength = 0.0
artwork_accent        = false

[scene]
kind = "travessia"
# Ordem da cena: tres ceus (madrugada, hora azul, amanhecer), colinas ao
# longe, colinas perto com a estrada, nevoa.
layers = [
    "assets/cena/ceu-madrugada.jpg",
    "assets/cena/ceu-hora-azul.jpg",
    "assets/cena/ceu-amanhecer.jpg",
    "assets/cena/colinas-longe.png",
    "assets/cena/colinas-perto.png",
    "assets/cena/nevoa.png",
]
