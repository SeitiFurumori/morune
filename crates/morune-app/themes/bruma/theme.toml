# Bruma — vidro neutro inspirado no Liquid Glass.
# A cor pertence ao desktop e as capas; o cromo usa luz branca.
# Direcao: docs/design/PESQUISA-AQUARIO-BRUMA-2026-09-10.md.
# Translucidez no fundo, nao no texto: piso mais firme e barras sem outro veu escuro.

[color]
# Base de fallback. Com DWM ativo a janela usa apenas 12% desta tinta.
background         = "#141b22bf"
surface            = "#151d2680"
sidebar_background = "#202a3533"
player_background  = "#202a3533"
# Menus precisam separar sua leitura do conteudo que cobrem.
surface_raised     = "#353638"
text           = "#f7f7f8"
text_muted     = "#e4e8ee"
text_on_accent = "#1c1c24"
accent         = "#eef0f4"
accent_hover   = "#ffffff"
# Limite funcional e reflexo decorativo tem intensidades diferentes.
border           = "#ffffff90"
border_highlight = "#ffffff38"
hover            = "#ffffff0f"
selected         = "#ffffff18"
focus_ring       = "#ffffff"
success          = "#5ed6a4"
warning          = "#f2c46b"
danger           = "#ff7b7b"
shadow           = "#00000030"
scrollbar        = "#ffffff80"

[typography]
family = "Segoe UI"
scale  = 1.0
size_xs      = 12.0
size_sm      = 13.0
size_md      = 15.0
size_lg      = 18.0
size_xl      = 24.0
size_display = 34.0
weight_normal = 400
weight_medium = 600
weight_bold   = 700
line_height    = 1.45
letter_spacing = -0.1

[shape]
radius_sm      = 10.0
radius_md      = 18.0
radius_lg      = 26.0
radius_artwork = 14.0
radius_avatar  = 999.0
spacing_xs = 4.0
spacing_sm = 8.0
spacing_md = 14.0
spacing_lg = 22.0
spacing_xl = 34.0
border_width       = 1.0
progress_thickness = 6.0
scrollbar_width    = 10.0

[control]
button_size         = 34.0
button_radius       = 999.0
primary_button_size = 44.0
icon_size           = 18.0
icon_size_primary   = 22.0
icon_stroke         = 1.8
slider_knob         = 14.0
tooltip_height      = 30.0

[motion]
enabled         = true
speed           = 1.0
duration_fast   = 120
duration_normal = 200
duration_slow   = 320
easing          = "ease-in-out"

[effects]
material = "liquid"
# Alfa global menor que 1 tambem apaga texto, icones e capas no Windows.
window_opacity        = 1.0
acrylic               = true
shadow_strength       = 0.15
gloss                 = 0.42
backdrop_blur         = 0.0
artwork_tint          = true
# O brilho da capa atras dela, no rodape. Fica em 0.06: com 0.12 uma capa
# clara sobre desktop branco ja derruba o `text_muted` do rodape para 4,38:1
# (teste `texto_dos_temas_de_vidro_resiste...`). A cor da capa aparece no
# acento, que nao disputa contraste com texto.
artwork_tint_strength = 0.06
# Bruma e branco sobre vidro: a capa entra como acento (progresso e "tocando"),
# nunca como fundo. Ver docs/design/PESQUISA-APP-OTIMO-2026-09-22.md.
artwork_accent        = true

[background]
image = ""
fit = "cover"
opacity = 1.0
tint = "#101820"
tint_strength = 0.0
blur = 0.0





