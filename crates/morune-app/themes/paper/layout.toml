# A composicao muda junto com a cor: barra lateral a direita, player no topo,
# listas no lugar de grade e densidade compacta.

[window]
default_width = 1100.0
default_height = 720.0
min_width = 720.0
min_height = 480.0
custom_titlebar = false
show_page_title = true

[sidebar]
position = "right"
width = 210.0
collapsed_width = 60.0
collapsible = true
start_collapsed = false
show_icons = false
show_labels = true
show_playlists = true
items = ["home", "search", "library"]

[player]
position = "top"
# 88 e nao 72: com a barra de progresso colada na borda, o tempo decorrido vai
# abaixo dos controles, e em 72 ele nao cabia -- ficava recortado e o tema
# terminava sem nenhuma indicacao numerica de posicao.
height = 88.0
show_artwork = true
artwork_size = 44.0
show_progress = true
progress_edge_to_edge = true
show_volume = true
show_shuffle_repeat = true
show_queue_button = true
show_times = true
center_controls = false

[content]
# `density` e token morto -- declarado no tema e sem uso em qualquer linha de
# interface --, entao o valor aqui e intencao, nao efeito. Quem de fato controla
# o respiro da lista neste tema e `row_height`, abaixo.
density = "comfortable"
# Lista, e nao grade -- e essa e a identidade do tema, nao um descuido. Papel
# organiza em coluna e nao em vitrine. Com a coluna de album ligada no modo
# lista, a tela le como indice de revista.
view_mode = "list"
card_width = 140.0
# 46 e o minimo que cabe as duas linhas da faixa neste tema: titulo em 15px e
# artista em 13px, ambos com entrelinha 1,5, somam 42px. Com 38 o texto
# transbordava a linha e as faixas se encostavam.
row_height = 46.0
# Continua em 0. **Nao porque uma coluna de leitura nao caberia aqui** -- num
# tema chamado Paper ela caberia bem --, mas porque `max_content_width` e token
# morto: existe em `morune-theme/src/layout.rs` e nao e lido por nenhuma linha
# de interface. Por um tema declarar um numero aqui, nada aconteceria.
max_content_width = 0.0
# Ligado. Estava desligado, e sem cabecalho o tema nao tinha um so lugar onde a
# serifa de 38px aparecesse -- ou seja, a metade bonita da tipografia nunca era
# vista. E era tambem o que deixava a tela sem nenhuma hierarquia.
show_hero = true
hero_height = 200.0
page_size = 100
