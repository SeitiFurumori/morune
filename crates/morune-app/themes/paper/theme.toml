# Paper e o contraponto do tema embutido: claro, quadrado e sem brilho.
# Serve tambem como prova de que a troca de tema muda mais que cor.
#
# **Redesenhado em 05/09/2026.** A versao anterior tinha cinco superficies
# dentro de 4% de luminosidade entre si -- cinco beges que nao se separavam de
# nada --, serifa de texto corrido usada ate em rotulo de 11px, e o acento
# tijolo saturado preenchendo botao inteiro. Lia como planilha bege, nao como
# papel.
#
# As tres decisoes que mudam isso:
#
# 1. **A folha branca e a superficie elevada.** Num tema papel, o que sobe nao
#    fica mais escuro: fica mais claro, como uma folha em cima da mesa. Cartao
#    e painel viram branco puro sobre a mesa creme, e ai a hierarquia existe sem
#    precisar de sombra -- que este tema quase nao tem, de proposito.
# 2. **Duas familias, e nao uma.** Serifa e para titulo; interface e sans. A
#    Georgia em 11px de rotulo ficava borrada e pesada. Agora `display_family`
#    carrega a serifa e `family` carrega a sans, que e exatamente para isso que
#    os dois campos existem -- e de quebra o tema passa a provar que da para
#    trocar tipografia por papel, e nao so a fonte.
# 3. **Acento de tinta, nao de tijolo.** O carmim escuro le como marca de
#    caneta vermelha na margem. O tom anterior, mais claro e mais saturado,
#    virava bloco quente de 800px quando caia num botao largo.

[color]
# A mesa: creme quente, um degrau mais clara que antes para a folha branca ter
# de onde subir.
background = "#f7f4ed"
# Painel e barra ficam junto da mesa; quem separa e a borda, nao o tom. Cinco
# tons quase iguais nao criavam hierarquia nenhuma, so sujeira.
surface = "#f2eee5"
# A folha. Branco puro de proposito: e o unico valor que le como papel novo.
surface_raised = "#ffffff"
player_background = "#f2eee5"
sidebar_background = "#f2eee5"

# Tinta, e nao cinza escuro: um preto levemente quente assenta sobre creme.
text = "#1c1a16"
text_muted = "#6d675c"
text_on_accent = "#fbf9f5"

# Carmim de correcao. Escuro o bastante para preencher botao sem virar bloco
# quente, e saturado o bastante para nunca ser confundido com o texto.
accent = "#7d2b20"
accent_hover = "#96382a"

# 0x6c e o menor alfa que da 3:1 contra o fundo, o minimo da WCAG 1.4.11
# para limite grafico. A trilha da barra de progresso usa esta mesma cor: a
# 9% de preto ela sumia no fundo claro, e nao dava para ver onde a musica
# estava.
border = "#0000006c"
# **Realce derivado do accent, e nao de branco.**
#
# `hover` e `selected` eram branco (ou preto) de baixa opacidade em quase todos
# os temas. Funciona como realce, mas nao pertence a tema nenhum: trocar de tema
# nao mudava a cor de passar o cursor. O realce e a resposta mais frequente que a
# interface da -- acontece a cada linha sob o cursor --, e deixa-lo neutro joga
# fora a chance mais barata de o tema aparecer.
#
# Alfa baixo de proposito: isto fica ATRAS de texto, entao o que se quer e um
# vies de matiz, nao um bloco de cor.
hover = "#7d2b2014"
selected = "#7d2b2029"
focus_ring = "#7d2b20"

success = "#38603d"
warning = "#7d5f1a"
danger = "#93332a"

shadow = "#00000022"
# Mesmo 3:1 da borda: a barra de rolagem diz onde a lista esta, e a WCAG
# trata isso como componente de interface, nao como enfeite.
scrollbar = "#0000006c"

[typography]
# Sans na interface, serifa no titulo. Segoe UI existe em todo Windows desde o
# Vista, entao nao ha risco de cair num substituto imprevisivel.
family = "Segoe UI"
display_family = "Georgia"
scale = 1.0
size_xs = 11.0
size_sm = 13.0
size_md = 15.0
size_lg = 19.0
size_xl = 26.0
size_display = 38.0
weight_normal = 400
weight_medium = 600
weight_bold = 700
line_height = 1.5
letter_spacing = 0.0

[shape]
radius_sm = 0.0
radius_md = 0.0
radius_lg = 0.0
radius_artwork = 0.0
radius_avatar = 0.0
spacing_xs = 4.0
spacing_sm = 10.0
spacing_md = 16.0
spacing_lg = 24.0
spacing_xl = 40.0
border_width = 1.0
# 2px era fino demais para um tema claro, onde o contraste entre trilha e fundo
# ja e menor do que num tema escuro.
progress_thickness = 4.0
scrollbar_width = 8.0

[motion]
enabled = true
speed = 0.7
duration_fast = 90
duration_normal = 150
duration_slow = 220
easing = "ease-out"

[effects]
window_opacity = 1.0
acrylic = false
shadow_strength = 0.2
backdrop_blur = 0.0
artwork_tint = false
artwork_tint_strength = 0.0
