# Dreamcore -- espaco liminar, sonho que se lembra mas nao se ve inteiro.
# A imagem e a estrela; os paineis sao vidro ameixa escuro para o olho
# descansar numa cena tao clara. Paleta tirada da propria imagem: ameixa das
# sombras, pessego do por do sol, rosa das nuvens.
#
# ICONES: os embutidos sao do Phosphor. Para trocar, ponha um .svg com o nome
# do icone em assets/icons/ -- ver docs/THEMING.md, secao "Icones".

[color]
background         = "#2b2440"
surface            = "#2b2440d4"
sidebar_background = "#2b2440d1"
player_background  = "#2b2440d1"
surface_raised     = "#3a3152"
text           = "#fff3ec"
text_muted     = "#e9dce6"
text_on_accent = "#2b2440"
accent         = "#f8b197"
accent_hover   = "#ffc7b0"
border           = "#fff3ec70"
border_highlight = "#ffffff00"
hover            = "#fff3ec14"
selected         = "#f8b19740"
focus_ring       = "#f8b197"
success          = "#8fe3c0"
warning          = "#ffd98e"
danger           = "#ff8fa3"
shadow           = "#00000040"
scrollbar        = "#b9a3c6cc"

[typography]
family         = "Nunito"
display_family = "Instrument Serif"
bundled_fonts  = ["Nunito-Regular.ttf", "Nunito-Bold.ttf", "InstrumentSerif-Regular.ttf"]
scale  = 1.0
size_xs      = 12.0
size_sm      = 13.0
size_md      = 15.0
size_lg      = 19.0
size_xl      = 28.0
size_display = 40.0
weight_normal = 400
weight_medium = 600
weight_bold   = 700
line_height    = 1.45
letter_spacing = 0.0

[shape]
radius_sm      = 14.0
radius_md      = 22.0
radius_lg      = 30.0
radius_artwork = 16.0
radius_avatar  = 999.0
spacing_xs = 4.0
spacing_sm = 8.0
spacing_md = 14.0
spacing_lg = 24.0
spacing_xl = 36.0
border_width       = 1.0
progress_thickness = 4.0
scrollbar_width    = 10.0

[control]
button_size         = 34.0
button_radius       = 999.0
primary_button_size = 46.0
icon_size           = 18.0
icon_size_primary   = 22.0
icon_stroke         = 1.6
slider_knob         = 14.0
tooltip_height      = 30.0

[motion]
enabled         = true
speed           = 1.0
duration_fast   = 140
duration_normal = 240
duration_slow   = 420
easing          = "ease-in-out"

[effects]
material              = "liquid"
finish                = "dream"
window_opacity        = 1.0
acrylic               = false
shadow_strength       = 0.2
gloss                 = 0.0
backdrop_blur         = 0.0
artwork_tint          = false
artwork_tint_strength = 0.0
artwork_accent        = false

[background]
image = "assets/fundo/corredor.jpg"
fit = "cover"
opacity = 1.0
tint = "#fff3ec"
tint_strength = 0.0
blur = 0.0
