[package]
name = "morune-spotify"
description = "Backend de Spotify do Morune: autenticacao, reproducao, catalogo e biblioteca sobre librespot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
morune-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }

# Busca e biblioteca so existem no Web API, que e HTTP comum. O cliente e o da
# propria sessao da librespot -- estes dois crates entram so pelos tipos de
# requisicao dele, e ja estao no binario por causa da librespot.
http = "1"
bytes = "1"

# Protocolo interno: o que o Web API deixou de entregar em 2024 -- playlists
# que o Spotify monta para a conta -- continua de pe pelo caminho que a
# librespot ja usa para tocar. Os dois crates entram para ler o protobuf de
# `get_rootlist` e `get_playlist`, e ja estao no binario por causa da librespot.
librespot-protocol = "0.8"
protobuf = "3"


# librespot: reimplementacao aberta do protocolo do Spotify. Os crates entram
# separados, e nao pelo agregado `librespot`, para nao arrastar a linha de
# comando e os backends de audio que nao usamos.
librespot-core = "0.8"
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend"] }

# O Morune tem a propria saida de audio, no lugar da `RodioSink` da librespot:
# ver `src/sink.rs`. Versao e features iguais as que a librespot ja pede, para
# ser a mesma instancia do crate e o mesmo `cpal` -- que o rodio reexporta,
# dispensando depender dele aqui.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
# So para ligar `audio_thread_priority`: sem ele, o cpal 0.16 tenta subir a
# prioridade da thread de saida passando o ID da thread onde o Windows espera um
# HANDLE -- a chamada falha calada e a thread de audio roda em prioridade normal.
# Com ele, a thread entra no MMCSS (categoria "Audio"), o mecanismo do Windows
# para audio nao falhar quando a CPU esta ocupada -- por exemplo, com um jogo.
# Mesma versao do cpal que o rodio usa, entao e o mesmo crate com a feature a mais.
cpal = { version = "0.16", default-features = false, features = ["audio_thread_priority"] }
librespot-metadata = "0.8"
librespot-oauth = "0.8"

# Fluxo interativo de OAuth proprio.
#
# A librespot tem um, e ele continua sendo usado para **renovar** token, que e
# silencioso e funciona bem. O que nao serve e o caminho interativo dela: a URL
# de autorizacao so vai para `println!` -- perdida num build sem console -- e a
# espera pelo retorno e um `TcpListener::incoming()` sem tempo limite e sem
# cancelamento. Ver `token.rs`.
#
# Sem features de TLS: o `reqwest` que faz a troca e o mesmo que ja esta no
# binario, com o TLS do sistema. Ligar `rustls-tls` aqui traria uma segunda
# pilha de TLS so para o login.
oauth2 = { version = "5.0", default-features = false, features = ["reqwest"] }
# Cliente HTTP da troca de codigo por token. Ja esta no binario pela librespot;
# entra como dependencia direta so para poder ser nomeado aqui, com
# `default-features = false` para nao trazer uma segunda pilha de TLS.
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
# Abre o navegador no login. A librespot ja depende dele; entra aqui direto
# porque o caminho interativo agora e nosso.
open = "5"
